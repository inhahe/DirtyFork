# DirtyFork BBS — main configuration file
#
# Copy this file to your data directory (or use --data-dir) and edit as needed.
# Any value not present here returns null; most settings have sensible defaults.

bbs_name: My BBS
sysop_name: Sysop
sysop_handle: ""   # handle that automatically receives the 'sysop' key on login
hostname: 0.0.0.0   # bind on all interfaces; set to a specific IP to restrict
port: 23

# BBS info screen (shown from main menu "About" option)
# bbs_location: ""           # city/state/country
# bbs_description: ""        # short description of the BBS
# bbs_phone: ""              # modem phone number(s)
# bbs_website: ""            # website URL
# bbs_established: ""        # year established
# bbs_info_screen: ""        # path to .ans or .bin file (shown instead of auto-generated info)

# Menu layout compactness: how much to prefer shorter/wider over taller/narrower.
# 1.0 = balanced. >1 = more columns (shorter). <1 = fewer columns (taller).
menu_compactness: 1.0

min_edit_width: 10  # minimum characters reserved for editing when quote margins get deep

# Ambient stars: dim stars that twinkle in the empty parts of the screen, from
# the login screen on (never inside doors). Off unless enabled here; a user can
# turn them off with "show_stars: false" in their user yaml.
# stars:
#   enabled: true
#   interval: 150       # ms per animation frame
#   probability: 0.001  # chance per empty cell per frame that a star appears
#   fg: 4               # colour 0-7 (0 black, 1 red, 2 green, 3 brown, 4 blue, 5 magenta,
#                       # 6 cyan, 7 white); a user may override it with stars_fg
#   fg_br: false        # bright colour; a user may override it with stars_fg_br

# Idle timeout in seconds (0 = disabled). Separate values for telnet and modem.
idle_timeout: 0
# Seconds before timeout to show "are you still there?" warning (0 = no warning, just disconnect)
idle_warning: 30

# Modem/serial support (optional — comment out to disable)
# modem:
#   baudrate: 115200        # serial port speed, not modem line speed — 115200 is ideal
#                           # because modem compression can exceed the line rate
#   init_string: ATZ        # default AT init command for all ports; the BBS then
#                           # sends its own settings (ATE0V1Q0, ATS0=0, AT&C1, AT&D2; see DOCS.md)
#   idle_timeout: 300       # modem idle timeout in seconds (0 = disabled)
#   ports:
#     - port: COM1
#     - port: COM2
#     - port: COM3
#       baudrate: 115200    # per-port override
#   # Legacy single-port format also supported:
#   # port: COM1

database: DirtyFork.db
files_dir: files               # the file library's folder: uploads, and files you put there yourself
file_library:                  # (see DOCS.md, File Library; paths are project-relative)
  # catalog: files/catalog/library.db   # the catalogue: every file listed, its tags and description
  # pending_dir: files/pending     # uploads waiting for a sysop's approval (Sysop > Vet Uploads)
  # zips_dir: files/zips           # zips library_sync.py makes of websites, webpages and repos
  # repos_dir: files/repos         # its clones of GitHub repositories
  upload_key: trusted_uploader     # uploads by holders of this key (and sysops) are listed at once
  # Sources for library_sync.py: folders and accounts whose files the library
  # lists. Linked types (gallery, videos, samples, mods) are listed where they
  # are; the rest are zipped into zips_dir. Every type, and its options:
  sources:
  #   websites:                    # each folder in dir is a website, zipped whole;
  #     type: websites             # loose .htm(l) files in it are webpages
  #     dir: D:/websites
  #     containers: [Organelle]    # folders whose subfolders are websites
  #     skip: [YouTube - Organelle]
  #   pages:
  #     type: webpages             # each .htm(l) with its _files folder, in all subfolders
  #     dir: D:/webpages
  #   github:
  #     type: github               # every public repository of an account
  #     user: someone
  #     include_forks: false
  #   pics:
  #     type: gallery              # pictures and videos, tagged by folder
  #     dir: D:/pictures
  #     captions: D:/gallery/thumbsup.db   # thumbsup2's AI captions as descriptions
  #   videos:
  #     type: videos               # yt-dlp downloads: the title becomes the description
  #     dir: D:/videos
  #     tags: [youtube]
  #   samples:
  #     type: samples              # samples and instruments, by extension
  #     dir: D:/samples
  #     hierarchy_tags: true       # tag each by the folders it is in
  #     scheduled: false           # only with --all (or by name): too big to rescan hourly
  #   mods:
  #     type: mods                 # tracker modules, zipped one per file
  #     dir: D:/modarchive
file_tags:                     # sysop-defined list of valid file tags
  - game
  - utility
  - dos
  - windows
  - art
  - music
  - document
  - programming
  - communication
  - demo
  - bbs
  - adult
upload_max_size: 100 MB        # largest file a caller may upload (B, KB, MB, GB)
upload_keep_free: 500 MB       # uploads are refused when they would leave less free disk than this
user_configs: user_configs

# bcrypt cost factor for password hashing. Higher = more secure but slower.
# Approximate times: 4=1ms, 6=3ms, 8=13ms, 10=50ms, 12=200ms (default bcrypt is 12)
# Existing passwords are re-hashed at this cost on next login.
bcrypt_rounds: 8

login:
  type: func
  target: login

log:
  path: DirtyFork.log
  split_at: 1_000_000
  max_length: 10_000_000
  max_age: "1 year"

input_fields: !include input_fields.yaml

user_defaults:
  main:
    destination: main
    menu_item: null
  menus:
    main: main
    colors:
      normal:
        fg: white
        fg_br: false
        bg: black
        bg_br: false
      noaccess:
        fg: black
        fg_br: true
        bg: black
        bg_br: false
      highlight:
        fg: white
        fg_br: true
        bg: black
        bg_br: false
  allow_door_popups: true  # allow BBS messages/popups to interrupt door sessions
  keys:
    - doors  # all users can access doors by default; add 'banned' key to block individuals

# Known keys: sysop, debug, doors, banned, trusted_uploader (file_library.upload_key)
# Key groups: a key that grants all keys in its list.
# Groups can include other groups (resolved recursively).
# Example: a user with "sysop" effectively has doors, debug, etc.
key_groups:
  sysop: [doors, debug]

destinations:
  main:
    type: menu
  door:
    type: module
    white_keys: [doors]
    # Path to your DOSBox-X executable:
    dosbox_path: C:\dosbox-x\dosbox-x.exe
    base_path: doors  # relative paths in door configs are relative to this directory
    # doors/tools (not included) is mounted as E: in every DOSBox door session.
    # Put a FOSSIL driver there (e.g. X00.EXE) for doors that need one, and
    # DOORWAY (in doors/tools/doorway) for the sysop DOS shell below.
    tools_path: tools
    fossil_command: X00.EXE  # run from E:\ before doors that have fossil: true
    max_nodes: 20
  teleconference:
    type: module
    # log: teleconference.log  # uncomment to log all teleconference messages
  messages:
    type: menu
  message:
    type: module
  forum:
    type: module
  files:
    type: menu
  file:
    type: module
  register:
    type: module
  settings:
    type: module
  sysop:
    type: menu
    white_keys: [sysop]
  sysop_module:
    type: module
    white_keys: [sysop]
  help:
    type: module
  oneonone:
    type: module
  bbsinfo:
    type: module
  user_info:
    type: module
  whos_online:
    type: module
  user_list:
    type: module
  user_director:
    type: func
  forums:
    type: menu
  all_forums:
    type: menu
  doors:
    type: menu
    white_keys: [doors]
  # Door categories: each is a submenu of the doors menu
  doors_popular:
    type: menu
    white_keys: [doors]
  doors_rpg:
    type: menu
    white_keys: [doors]
  # doors_space:          # e.g. a Space category (see the commented example below)
  #   type: menu
  #   white_keys: [doors]
  doors_sysop:
    type: menu
    white_keys: [sysop]

forum_list: &forum_list
  General: null
  # Add more forums here, or remove/rename these.
  # You can add white_keys/black_keys per forum for access control.

menu_system:
  main:
    screen_path: null
    inputs:
      option:
        row: null
        col: null
        length: null
    white_keys: []
    black_keys: []
    options:
      Help:
        target: help
        type: module
      Messages:
        target: messages
        type: menu
      Teleconference:
        target: teleconference
        type: module
      Doors:
        target: doors
        type: menu
        screen_path: null
      Forums:
        target: forums
        type: menu
      File Library:
        target: files
        type: menu
      Lookup:
        target: user_info
        type: module
      Who's Online:
        target: whos_online
        type: module
      Users:
        target: user_list
        type: module
      Settings:
        target: settings
        type: module
      About:
        target: bbsinfo
        type: module
      Sysop:
        target: sysop
        type: menu
        white_keys: [sysop]
  forums:
    option_defaults:
      options:
        option_defaults:
          target: forum
          menu_item: [.., .]   # (forum_name, action_name) — .. = parent, . = self
        New Posts:
          action: new
        Compose:
          action: compose
        Search:
          action: search
    options:
      All Forums:
        target: all_forums
      <<: *forum_list
  all_forums:
    options:
      New Posts:
        target: forum
        menu_item: ["*", new]
      Search:
        target: forum
        menu_item: ["*", search]
  # Door games.  The doors menu lists categories; each category is a menu of
  # its own (with a destinations entry and an optional breadcrumb title) whose
  # options launch the door module.  List a door in several categories with a
  # YAML alias; entries that share a dir share their nodes.
  #
  # Inside DOSBox: C:\ = per-node dir with all dropfiles (DOOR.SYS, DORINFO1.DEF,
  # CHAIN.TXT, DOOR32.SYS, CALLINFO.BBS, SFDOORS.DAT), D:\ = the door's dir
  # (doors/<dir>), E:\ = doors/tools.  Commands run from D:\.  Point the door's
  # own config at C:\ for its dropfile.
  #   fossil: true          load the FOSSIL driver (fossil_command) first
  #   pre_commands: [...]   DOS commands run before the door
  #   dosbox_settings:      per-door DOSBox-X overrides, e.g. {cpu: {cycles: 20000}}
  #   date_shift_years: 28  run the door's clock 28 years back (Y2K-buggy doors)
  #   white_keys/black_keys on a door restrict that door only
  # Native 32-bit doors (no DOSBox): native: true, communication_type: SOCKET
  # (default) or STDIO, e.g. command: 'mydoor.exe -socket {socket_port} -node {node}'
  doors:
    options:
      Most Popular:
        target: doors_popular
      Role-Playing:
        target: doors_rpg
      # Space:
      #   target: doors_space
      Sysop Tools:
        target: doors_sysop
  doors_popular:
    title: Most Popular
    option_defaults: &door_defaults
      target: door
      dosbox_conf: doors/dosbox.conf  # default DOSBox-X base config; override per door
      # Shared values — any scalar here becomes a {variable} in dropfile sections.
      # Override per door to affect every format at once.
      security_level: "0"         # used by all formats
      ansi: "1"                   # ANSI capable; used by dorinfo, chain_txt, callinfo_bbs, sfdoors_dat
      home_phone: ""              # used by door_sys and callinfo_bbs
      expiration_date: "01/01/00" # used by door_sys and callinfo_bbs
      user_record: "1"            # used by door_sys, callinfo_bbs, door32_sys
      door_sys:    !include doors/dropfiles/door_sys.yaml
      dorinfo:     !include doors/dropfiles/dorinfo.yaml
      chain_txt:   !include doors/dropfiles/chain_txt.yaml
      callinfo_bbs: !include doors/dropfiles/callinfo_bbs.yaml
      door32_sys:  !include doors/dropfiles/door32_sys.yaml
      sfdoors_dat: !include doors/dropfiles/sfdoors_dat.yaml
    options:
      Legend of the Red Dragon: &door_lord
        # LORD (doors/lord_demo).  NODE<n>.DAT in its dir: BBSTYPE QBBS, BBSDROP C:\
        max_nodes: 10
        command: 'START.BAT {node}'
        dir: 'lord_demo'
      # Example of a door you install yourself (doors/tw2002); add it to a
      # category too, e.g. a Space category:
      # Trade Wars 2002: &door_tw2002
      #   # nodes set up in TEDIT: DOOR drop file type, path C:\, COM1
      #   max_nodes: 4
      #   command: 'TW2002.EXE TWNODE={node}'
      #   dir: 'tw2002'
  doors_rpg:
    title: Role-Playing
    option_defaults: *door_defaults
    options:
      Legend of the Red Dragon: *door_lord
  # doors_space:
  #   title: Space
  #   option_defaults: *door_defaults
  #   options:
  #     Trade Wars 2002: *door_tw2002
  doors_sysop:
    title: Sysop Tools
    option_defaults: *door_defaults
    options:
      # Remote DOS prompt with D:\ = doors/, for running door installers and
      # config programs from your terminal.  Needs DOORWAY in doors/tools/doorway.
      # DOS Shell (doors directory):
      #   white_keys: [sysop]
      #   max_nodes: 1
      #   key_translation: doorway   # your terminal's arrow/function keys -> DOORWAY
      #   command: 'E:\DOORWAY\DOORWAY.EXE COM1 /V:D /O:T /M:999 /G:ON /C:DOS'
      #   dir: '.'
      Test Door (FOSSIL):
        # loads the FOSSIL driver from doors/tools; without one it falls back to BIOS
        fossil: true
        command: 'TESTDOOR.EXE /FOSSIL /PORT:0'
        dir: 'testdoor'
      Test Door (BIOS):
        command: 'TESTDOOR.EXE /BIOS /PORT:0'
        dir: 'testdoor'

  files:
    option_defaults:
      target: file
    options:
      Search:
        action: search
      Browse:
        action: browse
      List All:
        action: list
      Download:
        action: download
      Upload:
        action: upload
  messages:
    option_defaults:
      target: message
    options:
      New Messages:
        action: new
      Compose:
        action: compose
      Search:
        action: search
  sysop:
    option_defaults:
      target: sysop_module
    options:
      Keys:
        action: user_keys
      Groups:
        action: key_groups
      Edit User:
        action: user_settings
      Vet Uploads:
        action: vet_uploads
